<div class="container mx-auto max-w-xl p-6">
  <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6">📝 To-Do List</h2>

  <!-- Form to add a new task -->
  <form (ngSubmit)="addTask()" class="flex gap-4 mb-6">
    <input
      type="text"
      [(ngModel)]="task"
      name="task"
      placeholder="Enter a new task"
      required
      class="flex-1 px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
    />
    <button
      type="submit"
      class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 transition duration-200"
    >
      Add
    </button>
  </form>

  <!-- Display tasks -->
  <ul class="space-y-3">
    <li
      *ngFor="let todo of tasks"
      class="flex justify-between items-center bg-white p-4 rounded-md shadow hover:bg-gray-50 transition"
    >
      <span class="text-gray-800 text-lg">{{ todo.task }}</span>
      <button
        (click)="removeTask(todo._id)"
        class="text-red-600 hover:text-red-800 transition"
        title="Delete task"
      >
        ❌
      </button>
    </li>
  </ul>

  <!-- Message for empty task list -->
  <p *ngIf="tasks.length === 0" class="text-center text-gray-500 mt-6">
    No tasks yet. Add one above! 😄
  </p>
</div>
