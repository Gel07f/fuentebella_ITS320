<p class="text-2xl md:text-3xl font-bold text-center text-blue-700 mb-6 tracking-wide">List of Quotes!</p>

<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 mx-4 md:mx-8 lg:mx-auto max-w-6xl">
  <div *ngFor="let quote of quotes"
       class="shadow-lg rounded-xl p-4 sm:p-6 bg-pink-100 border border-pink-300 hover:shadow-2xl transition-all duration-300 transform hover:scale-105"
       [ngClass]="{
          'bg-gradient-to-r from-sky-200 to-blue-300 hover:from-blue-300 hover:to-sky-400': quote.isHenriMatisse
       }">
    <p class="text-lg md:text-xl font-semibold text-gray-700 text-center mb-2">Title: {{quote.title}}</p>
    <ul class="space-y-1 text-gray-800">
      <li class="font-medium text-gray-900">“{{quote.quotes}}”</li>
      <li class="text-gray-700"><span class="font-semibold">Author:</span> {{quote.author}}</li>
      <li class="text-gray-600"><span class="font-semibold">Published:</span> {{quote.published}}</li>
    </ul>
  </div>
</div>
